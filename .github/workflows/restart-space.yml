name: Keep Hugging Face Space Alive

on:
  schedule:
    - cron: "*/30 * * * *"  # cada 30 minutos: visita el Space y revisa su estado
  workflow_dispatch:

# Evita que dos ejecuciones se solapen
concurrency:
  group: keep-space-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Ping the Space and restart it only if it is broken
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ferferefer/DR
          SPACE_URL: https://ferferefer-dr.hf.space/
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              print("ERROR: el secreto HF_TOKEN no esta configurado en el repo.")
              sys.exit(1)

          repo_id = os.environ["SPACE_ID"]
          space_url = os.environ["SPACE_URL"]
          api = HfApi(token=token)

          # Una peticion HTTP cuenta como "visita" y reinicia el contador de inactividad
          # (cpu-basic duerme tras 48h sin visitas). Esto es lo que evita que se duerma.
          # Se usa urllib (stdlib) a proposito: huggingface_hub ya no depende de requests
          # (desde la v1 usa httpx), asi que un GET sin dependencias extra no se rompe.
          def ping():
              req = urllib.request.Request(space_url, headers={"User-Agent": "keep-alive-bot"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print(f"Ping a {space_url} -> HTTP {r.status}")
                      return r.status
              except urllib.error.HTTPError as e:
                  # Una respuesta de error sigue contando como visita para el contador de HF
                  print(f"Ping a {space_url} -> HTTP {e.code}")
                  return e.code
              except Exception as e:
                  print(f"Ping a {space_url} fallo: {e}")
                  return None

          # Estados en los que el Space ya esta arriba o levantandose
          HEALTHY = {"RUNNING", "RUNNING_BUILDING", "RUNNING_APP_STARTING", "BUILDING", "APP_STARTING"}
          # Estados en los que basta una visita para despertarlo
          WAKEABLE = {"SLEEPING", "STOPPED"}

          try:
              stage = api.get_space_runtime(repo_id).stage
              print(f"Estado actual del Space: {stage}")
          except Exception as e:
              print(f"ERROR al consultar el estado de {repo_id}: {e}")
              sys.exit(1)

          if stage in HEALTHY:
              # Camino normal: solo lo visitamos para que no llegue a dormirse nunca.
              ping()
              print("El Space esta funcionando y su contador de inactividad se ha reiniciado.")
              sys.exit(0)

          if stage in WAKEABLE:
              # Despertar con una visita es mas barato y rapido que un restart completo.
              print(f"El Space esta dormido ({stage}). Despertandolo con una visita...")
              ping()
              print("Visita enviada; el Space deberia estar arrancando.")
              sys.exit(0)

          # PAUSED / RUNTIME_ERROR / BUILD_ERROR: una visita no lo arregla, hay que reiniciar.
          print(f"El Space esta caido ({stage}). Reiniciando via API...")
          try:
              api.restart_space(repo_id=repo_id)
              print(f"Space {repo_id} reiniciado correctamente")
          except Exception as e:
              print(f"ERROR al reiniciar {repo_id}: {e}")
              sys.exit(1)
          PY
